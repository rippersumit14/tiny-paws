name: Deploy Godot Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -euxo pipefail
          GODOT_VERSION=4.7.2
          GODOT_TAG=4.7.2-stable
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_TAG}_linux.x86_64.zip"
          mv "Godot_v${GODOT_TAG}_linux.x86_64" godot
          chmod +x godot

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_TAG}_export_templates.tpz" -d godot_templates
          cp godot_templates/templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Export web client
        run: |
          set -euxo pipefail
          mkdir -p builds/web
          ./godot --headless --path game --export-release Web ../builds/web/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
