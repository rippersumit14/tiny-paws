name: Release Windows Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Install Godot and export templates
        shell: pwsh
        run: |
          $GodotVersion = "4.7.2"
          $GodotTag = "4.7.2-stable"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$GodotTag/Godot_v$($GodotTag)_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$GodotTag/Godot_v$($GodotTag)_export_templates.tpz" -OutFile templates.tpz
          New-Item -ItemType Directory -Force "$env:APPDATA\Godot\export_templates\$GodotVersion.stable" | Out-Null
          Copy-Item templates.tpz templates.zip
          Expand-Archive templates.zip -DestinationPath templates
          Copy-Item templates\templates\* "$env:APPDATA\Godot\export_templates\$GodotVersion.stable" -Recurse -Force

      - name: Export Windows game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builds\windows | Out-Null
          .\godot\Godot_v4.7.2-stable_win64.exe --headless --path game --export-release "Windows Desktop" ..\builds\windows\TinyPaws.exe

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path builds\windows\* -DestinationPath TinyPaws-Windows-x64.zip -Force

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release.outputs.tag }}
          name: Tiny Paws ${{ steps.release.outputs.tag }}
          body: Windows x64 playable build for Tiny Paws.
          artifacts: TinyPaws-Windows-x64.zip
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ github.token }}

      - name: Verify release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -eq "TinyPaws-Windows-x64.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "TinyPaws-Windows-x64.zip was not attached to release $tag"
          }
          if ($asset.size -lt 1000000) {
            throw "Release asset is unexpectedly small: $($asset.size)"
          }
