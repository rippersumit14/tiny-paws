name: Release Windows Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Install Godot and export templates
        shell: pwsh
        run: |
          $GodotVersion = "4.7.2"
          $GodotTag = "4.7.2-stable"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$GodotTag/Godot_v$($GodotTag)_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$GodotTag/Godot_v$($GodotTag)_export_templates.tpz" -OutFile templates.tpz
          New-Item -ItemType Directory -Force "$env:APPDATA\Godot\export_templates\$GodotVersion.stable" | Out-Null
          Copy-Item templates.tpz templates.zip
          Expand-Archive templates.zip -DestinationPath templates
          Copy-Item templates\templates\* "$env:APPDATA\Godot\export_templates\$GodotVersion.stable" -Recurse -Force

      - name: Export Windows game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builds\windows | Out-Null
          .\godot\Godot_v4.7.2-stable_win64.exe --headless --path game --export-release "Windows Desktop" ..\builds\windows\TinyPaws.exe

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path builds\windows\* -DestinationPath TinyPaws-Windows-x64.zip -Force

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $repo = "${{ github.repository }}"
          gh api "repos/$repo/releases/tags/$tag" *> $null
          if ($LASTEXITCODE -ne 0) {
            $release = gh api --method POST "repos/$repo/releases" `
              -f tag_name="$tag" `
              -f target_commitish="${{ github.sha }}" `
              -f name="Tiny Paws $tag" `
              -f body="Windows x64 playable build for Tiny Paws." `
              -F draft=false `
              -F prerelease=false | ConvertFrom-Json
          } else {
            $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          }
          foreach ($asset in $release.assets) {
            if ($asset.name -eq "TinyPaws-Windows-x64.zip") {
              gh api --method DELETE "repos/$repo/releases/assets/$($asset.id)"
            }
          }
          $uploadUrl = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=TinyPaws-Windows-x64.zip"
          Invoke-RestMethod `
            -Method Post `
            -Uri $uploadUrl `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -ContentType "application/zip" `
            -InFile "TinyPaws-Windows-x64.zip"
          gh api --method PATCH "repos/$repo/releases/$($release.id)" -F make_latest=true

      - name: Verify release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -eq "TinyPaws-Windows-x64.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "TinyPaws-Windows-x64.zip was not attached to release $tag"
          }
          if ($asset.size -lt 1000000) {
            throw "Release asset is unexpectedly small: $($asset.size)"
          }
